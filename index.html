<header class="top">

  <nav id="tabs" aria-label="Main navigation">

    <button data-tab="progreso">Progress</button>
    <button data-tab="glosario">Glossary</button>
  </nav>
  <div class="top-actions" style="display:flex;align-items:center;gap:0.45rem">
    <button id="cloud-sync-btn" class="sync-pill" type="button" title="Sync progress to cloud" aria-label="Sync progress to cloud">☁️ <span id="cloud-sync-label">Sync</span></button>
    <button id="lang-toggle" class="icon-btn lang-btn" type="button" title="Switch language (ES/EN)" aria-label="Switch language (ES/EN)">EN</button>
    <button id="theme-toggle" class="icon-btn" type="button" title="Toggle light/dark theme" aria-label="Toggle light/dark theme">🌓</button>

</header>
