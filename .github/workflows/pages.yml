name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Job 1: empaqueta el sitio estático y sube el artefacto "github-pages".
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Activa GitHub Pages en el repositorio si aún no lo está
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # Job 2: despliega el artefacto. Va en un job separado (patrón de la plantilla
  # oficial) porque deploy-pages en el mismo job que la subida a veces consulta
  # la API antes de que el artefacto sea visible y falla con
  # "No artifacts named github-pages were found" (actions/deploy-pages#451).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
